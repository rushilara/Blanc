name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts + fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Schemas are valid and fixtures conform
        run: python starter/validate_schemas.py
      - name: Source-grounding cross-reference checks
        working-directory: starter
        run: |
          python validate_fixture.py
          python -m unittest -v test_validator.py

  # Backend (FastAPI). Skips until backend/requirements.txt exists (BLA-6).
  # Convention: runtime deps in backend/requirements.txt, test/lint deps in
  # backend/requirements-dev.txt (optional), tests under backend/tests/.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # pull-requests: write is only used to post the sticky coverage comment.
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Detect backend
        id: detect
        working-directory: .
        run: |
          if [ -f backend/requirements.txt ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No backend/requirements.txt yet, skipping."; fi
      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          pip install pytest ruff
      - name: Lint (ruff)
        if: steps.detect.outputs.present == 'true'
        run: ruff check .
      # Coverage config (source, omit, fail_under = 80% floor) is in backend/pyproject.toml.
      # This step fails below the floor; the report steps below still run.
      - name: Tests (pytest + coverage)
        if: steps.detect.outputs.present == 'true'
        run: |
          if [ -d tests ]; then
            pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-report=html
          else
            echo "No backend/tests yet."
          fi
      - name: Coverage summary
        id: coverage
        if: always() && steps.detect.outputs.present == 'true' && hashFiles('backend/coverage.xml') != ''
        run: |
          {
            echo "<!-- blanc-coverage-report -->"
            echo "## Backend coverage: $(coverage report --format=total --fail-under=0)%"
            echo
            coverage report --format=markdown --fail-under=0
            echo
            echo "_Lines covered by \`backend/tests\`. Full HTML report: \`backend-coverage\` artifact on the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})._"
          } > coverage-summary.md
          cat coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: always() && steps.coverage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.xml
            backend/htmlcov/
          retention-days: 14
      # Sticky PR comment (one comment, updated on each push). Skipped for fork
      # PRs, whose GITHUB_TOKEN is read-only. Never fails the job.
      - name: Post coverage comment on PR
        if: >-
          always() && steps.coverage.outcome == 'success' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- blanc-coverage-report -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@coverage-summary.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@coverage-summary.md > /dev/null
          fi

  # Frontend (Next.js). Skips until frontend/package.json exists (BLA-6).
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        working-directory: .
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No frontend/package.json yet, skipping."; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: npm run lint --if-present
      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: npm run typecheck --if-present
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: npm run build --if-present
      - name: Tests
        if: steps.detect.outputs.present == 'true'
        run: npm test --if-present

  # BLA-61: the optional hosted backend image builds, starts, and keeps evidence out.
  compose:
    name: Laptop stack (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings with sign-in on (CI-only secret; no Gemini key needed)
        run: |
          echo "BLANC_AUTH_SECRET=$(openssl rand -hex 32)" > .env
          mkdir -p .blanc && chmod 777 .blanc
      - name: Build and start, waiting for both health checks
        run: docker compose up -d --build --wait
      - name: No evidence, databases or secrets in the frontend image
        run: |
          docker compose run --rm --no-deps --entrypoint sh frontend -c \
            'test ! -e /app/.env && test ! -e /app/frontend/.env && ! find /app -name "*.db" -not -path "*/node_modules/*" | grep -q .'
      - name: Signed out, the app and the API are closed
        run: |
          curl -fsS http://127.0.0.1:8000/health | grep -q '"auth_required":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/cases)" = 401
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://127.0.0.1:3000/workspace | tee /tmp/r
          grep -q '^307 .*/blanc/index.html' /tmp/r
          curl -fsS -o /dev/null http://127.0.0.1:3000/blanc/index.html
      - name: Add a user in the container, sign in, and use the API
        run: |
          printf 'ci-password-123\n' | docker compose run --rm -T --no-deps frontend npm run -s auth:add-user -- ci
          curl -s -c jar -o /dev/null -w '%{http_code} %{redirect_url}\n' \
            -d 'username=ci&password=ci-password-123&next=/live' http://127.0.0.1:3000/api/auth/login | tee /tmp/r
          grep -q '^303 .*/live$' /tmp/r
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/live)" = 200
          curl -fsS -b jar -X POST http://127.0.0.1:8000/cases -H 'Content-Type: application/json' -d '{"title":"Compose check"}'
          curl -fsS -b jar http://127.0.0.1:8000/cases | grep -q 'Compose check'
          docker compose exec -T backend test -f /data/blanc.db
      - name: Logs
        if: always()
        run: docker compose logs --tail 40

  backend-image:
    name: Backend image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t blanc-backend backend
      - name: No evidence, databases or secrets in the image
        run: |
          docker run --rm --entrypoint sh blanc-backend -c \
            'test ! -e /srv/blanc/data && test ! -e /srv/blanc/.env && test ! -e /srv/blanc/tests && ! find /srv/blanc -name "*.db" | grep -q .'
      - name: Starts and answers /health with data on a mounted volume
        run: |
          docker run -d --name blanc -p 8000:8000 -v blanc-data:/data blanc-backend
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/cases -H 'Content-Type: application/json' -d '{"title":"Image check"}'
          docker exec blanc test -f /data/blanc.db
          docker logs blanc | tail -20
